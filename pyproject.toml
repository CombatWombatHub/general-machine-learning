[project]
name = "aiml-notes"
version = "0.1.0"
description = "Compilation of notes and examples for general machine learning and AI concepts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1", # required for transformers TrainingArguments?
    "datasets>=4.1.1",
    "fastai>=2.8.6",
    "ipykernel>=6.30.0",
    "ipywidgets>=8.1.7", # without this, Jupyter won't show widgets like progress bars
    "kaggle>=1.7.4.5",
    "matplotlib>=3.10.3",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1", # required for transformers with microsoft/deberta-v3-small
    "shap>=0.49.1",
    "tensorflow>=2.20.0",
    "tf-keras>=2.20.1", # tensorflow's keras is now a separate package
    "tiktoken>=0.11.0", # required for transformers with microsoft/deberta-v3-small
    "torch>=2.8.0", # this is PyTorch
    "transformers>=4.56.2",
]

[dependency-groups]
app = [
    "streamlit>=1.47.1",
]
dev = [
    "mypy>=1.17.1", # for static type checking (run "mypy --install-types" to find missing stubs, then install with "uv add")
    "pandas-stubs>=2.3.2.250827",
]
docs = [
    "myst-nb>=1.3.0",
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.1.4",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-mermaid>=1.0.0",
]
graphics = [
    "manim>=0.19.0",
]

# install a version of PyTorch that will use my local CUDA 13 GPU
# https://docs.astral.sh/uv/guides/integration/pytorch/
# there are ways to control the version with command line arguments
# may need to employ those eventually if I want to run non-locally

# set specific packages to come from specific sources
[tool.uv.sources]
torch       = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

# add PyTorch index to pull specific builds of PyTorch
[[tool.uv.index]]
name = "pytorch-cu130" # CUDA 13
url = "https://download.pytorch.org/whl/cu130" # pytorch location for CUDA 13
explicit = true # only pull specific packages from this index
